<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur de personnage</title>
<style>
body{margin:0;background:#12141c;color:#dde;font:14px system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#1b2030}
a{color:#7ee08a}input,button,select{font:inherit}
button{background:#2c3550;color:#fff;border:1px solid #556;border-radius:5px;padding:4px 10px;cursor:pointer}
button.on{background:#4aa3ff;color:#000}
select{background:#0d1018;color:#fff;border:1px solid #445;border-radius:4px;padding:3px 4px;max-width:210px}
input[type=number],input[type=text]{background:#0d1018;color:#fff;border:1px solid #445;border-radius:4px;padding:3px 6px;width:90px}
main{display:flex;gap:12px;padding:12px;flex-wrap:wrap}
nav{width:190px;display:flex;flex-direction:column;gap:4px}nav h4{margin:10px 0 2px;color:#8aa0d0}nav button{text-align:left}
section.main{flex:1;min-width:300px;max-width:820px}
canvas{touch-action:none;width:100%;max-width:480px;background:#10131f;border-radius:8px;display:block}
#form{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 16px;margin-top:10px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{border:1px solid #334;padding:6px;border-radius:6px}
.sec{grid-column:1/-1;border:1px solid #334;border-radius:6px;padding:4px 10px;background:#161a27}
.sec>summary{cursor:pointer;font-weight:bold;color:#8aa0d0;padding:3px 0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 16px;margin:6px 0}
small{color:#99a}
</style></head><body>
<header>
 <a href="index.html">← Retour au jeu</a>
 Nom : <input type="text" id="nm" style="width:160px">
 <button id="ex">Exporter personnage.js</button><button id="im">Importer</button><button id="ra">Tout réinitialiser</button>
 <input type="file" id="fi" accept=".js,.json" hidden>
 <small>Brouillon enregistré automatiquement (recharge le jeu pour tester). Pour le publier : exporte <b>personnage.js</b> et remplace-le dans ton dépôt.</small>
</header>
<main>
 <nav id="list"></nav>
 <section class="main">
  <div id="pvw">
   <canvas id="pv" width="480" height="300"></canvas>
   <p id="ctl"><button id="pl">⏯ Lecture / pause</button> <input type="range" id="sl" min="0" max="10" value="0" style="width:230px;vertical-align:middle"> <small>(60 images = 1 seconde)</small></p>
  </div>
  <div id="form"></div>
  <p><button id="rm">Réinitialiser cette attaque</button></p>
 </section>
</main>
<script src="personnage.js"></script>
<script src="chars.js"></script>
<script>
const $=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const GROUPS={'Normales au sol':['jab','dash','ftilt','utilt','dtilt','fsmash','usmash','dsmash'],'Aériennes':['nair','fair','bair','uair','dair'],'Saisies et lancers':['grab','tf','tb','tu','td'],'Relevés':['getup','ledgeatk'],'Spéciaux (B)':['neuB','sideB','upB','downB','exB']};
const MF=[['s','Démarrage (images avant le coup)'],['a','Durée active (images)'],['e','Lag de fin (images)'],['d','Dégâts (%)'],['kb','Éjection de base',.5],['gr','Éjection selon le % adverse',.01],['ang','Angle d\'éjection (°, 90 = haut)'],['vx','Vitesse horizontale pendant le coup',.5],['vy','Impulsion verticale au début',.5],['rh','Répéter le coup toutes les N images (0 = une seule fois)'],['gs','Gravité pendant l\'attaque (× ; 0 = vol)',.1],['chmax','Charge max (images)'],['chd','Bonus de dégâts à pleine charge (×)',.1]];
const PF=[['walk','Vitesse de marche',.1],['run','Vitesse de course',.1],['jump','Force du saut',.5],['ajump','Force du saut aérien',.5],['jumps','Nombre de sauts aériens',1],['gravity','Gravité',.05],['fall','Vitesse de chute max',.5],['fast','Chute rapide max',.5],['air','Vitesse de déplacement en l\'air',.1],['weight','Poids (1 = normal ; plus lourd = moins éjecté)',.1]];
const FL=[['ch','Chargeable (smash)'],['sym','Zone des deux côtés'],['air','Attaque aérienne'],['rec','Utilisable une seule fois en l\'air (récupération)'],['nc','Non annulable sur un coup touché'],['refl','Renvoie les projectiles adverses (pendant la phase active)']];
const STRF=['n','nx','sf','sh','bcl','hk','hc','hc2','ht'];
const PSTR=['shape','color','color2','hk','hc','hc2','sf','sh','txt','exs','ht'];
const FSTR=['color','color2','ease','at','txt'];
const IVM=[[0,'Aucune'],[1,'Invincible'],[2,'Armure (ne recule pas)']];
const HKINDS=[['','Aucun'],...FX_KINDS.filter(k=>!['sheet','image'].includes(k[0]))];
window.onSkinLoad=()=>{try{draw()}catch(e){}};
let CH=loadChar(),cur='jab',fr=0,play=true,li=0,ipv='fsmash';
const OPEN=new Set(['base']);
const OX=200,OY=235,ZM=2.2;
const SCL=()=>CH.body.scale||1,K=()=>ZM*SCL();
const NOM=()=>cur==='_p'||cur==='_b';
const PM=()=>CH.moves[cur==='_i'?ipv:cur];
const PJ=[['t','Torse (penché)',-60,60],['c','Accroupi',0,30],['af','Bras avant',-200,380],['ab','Bras arrière',-200,380],['lf','Jambe avant',-200,380],['lb','Jambe arrière',-200,380],['rf','Poignet objet avant',-180,180],['rb','Poignet objet arrière',-180,180]];
function setKey(m,t,pose){m.anim=m.anim||[];const o={};for(const k of PK)o[k]=Math.round((pose[k]||0)*10)/10;const i=m.anim.findIndex(q=>q.t===t),nk={t,pose:o};if(i>=0)m.anim[i]=nk;else m.anim.push(nk);m.anim.sort((a,b)=>a.t-b.t)}
function setBoxKey(m,t,b){b=b.map(v=>Math.round(v));if(m.boxKeys&&m.boxKeys.length){const i=m.boxKeys.findIndex(k=>k.t===t);if(i>=0)m.boxKeys[i].box=b;else{m.boxKeys.push({t,box:b});m.boxKeys.sort((a,c)=>a.t-c.t)}}else m.box=b}
function sync(){if(NOM()||cur==='_i')return;const m=M(),po=animPose(m,fr),b=boxAt(m,fr);
 document.querySelectorAll('[data-pj]').forEach(el=>{const v=Math.round(po[el.dataset.pj]||0);if(document.activeElement!==el)el.value=v;const o=document.querySelector('[data-po="'+el.dataset.pj+'"]');if(o)o.textContent=v});
 const f=$('fn');if(f)f.textContent=fr;
 document.querySelectorAll('[data-bn]').forEach(el=>{if(b&&document.activeElement!==el)el.value=Math.round(b[+el.dataset.bn])})}
// ---------- petits générateurs de champs
const nI=(l,at,v,st,w)=>`<label>${l}<input type="number" step="${st||1}" value="${E(v)}" ${at}${w?` style="width:${w}px"`:''}></label>`;
const sI=(l,at,list,c)=>`<label>${l}<select ${at}>${list.map(([id,n])=>`<option value="${E(id)}" ${(c??'')==id?'selected':''}>${n}</option>`).join('')}</select></label>`;
const cI=(l,at,v)=>`<label>${l}<input type="checkbox" ${at} ${v?'checked':''}></label>`;
const colI=(l,at,v)=>`<label>${l}<input type="color" ${at} value="${v}" style="width:60px"></label>`;
const sec=(id,t,h)=>`<details class="sec" data-sec="${id}" ${OPEN.has(id)?'open':''}><summary>${t}</summary><div class="g">${h}</div></details>`;
// ---------- projectiles
function projForm(q,i){
 const a=f=>`data-ar="proj" data-ai="${i}" data-af="${f}"`,n=(f,l,st)=>nI(l,a(f),q[f],st,70),sl=(f,l,list)=>sI(l,a(f),list,q[f]);
 const sh=FX_KINDS.filter(k=>k[0]!=='sheet');
 let h=`<details class="sec" data-sec="pj${i}" ${OPEN.has('pj'+i)?'open':''}><summary>Projectile ${i+1} — ${E((FX_KINDS.find(k=>k[0]===(q.shape||'burst'))||[0,'?'])[1])} <button data-lx="rproj${i}">✕ supprimer</button></summary>`;
 h+=`<b>Départ</b><div class="g">${n('t','Image de départ')}${n('x','Position X')}${n('y','Position Y')}${n('vx','Vitesse X',.5)}${n('vy','Vitesse Y',.5)}${n('g','Gravité',.05)}${n('life','Durée de vie (images)')}${n('n','Nombre de tirs')}${n('spread','Écart entre les tirs (°)')}${n('jit','Dispersion au hasard (°)')}${cI('Vise l\'adversaire',a('aim'),q.aim)}${cI('Apparaît au sol (piège, pilier)',a('gnd'),q.gnd)}${cI('Suit le personnage (aura, orbe)',a('fol'),q.fol)}${sl('sf','Son au tir',SFX_LIST)}</div>`;
 h+=`<b>Trajectoire</b><div class="g">${n('acc','Accélération (× par image ; 1 = aucune)',.01)}${n('home','Autoguidage (0 à 1)',.01)}${n('wave','Ondulation (amplitude)')}${n('wf','Ondulation (vitesse)',.5)}${n('ret','Boomerang : revient après N images')}${n('bounce','Rebonds sur le sol')}${n('grow','Taille finale (× la taille de départ)',.1)}</div>`;
 h+=`<b>Impact</b><div class="g">${n('r','Taille (rayon)')}${n('len','Longueur (rayon / laser)')}${n('d','Dégâts')}${n('kb','Éjection',.5)}${n('gr','Éjection selon le %',.01)}${n('ang','Angle d\'éjection')}${cI('Traverse l\'adversaire',a('pierce'),q.pierce)}${n('rh','Touche à nouveau toutes les N images')}${n('stn','Étourdissement en plus (images)')}${n('hl','Gel de l\'image en plus (images)')}${n('shk','Tremblement de l\'écran')}${n('dot','Brûlure : dégâts au total')}${n('dotT','Brûlure : durée (images)')}${n('vamp','Vol de vie (0 à 1)',.05)}${sl('sh','Son à l\'impact',SFX_LIST)}</div>`;
 h+=`<b>Explosion à la fin</b><div class="g">${n('exr','Rayon de l\'explosion (0 = aucune)')}${n('exd','Dégâts de l\'explosion')}${n('exk','Éjection de l\'explosion',.5)}${sl('exs','Son de l\'explosion',SFX_LIST)}</div>`;
 h+=`<b>Aspect</b><div class="g">${sl('shape','Forme',sh)}${colI('Couleur 1',a('color'),q.color||'#ff8c28')}${colI('Couleur 2',a('color2'),q.color2||'#ffd24a')}${n('spin','Rotation')}${q.shape==='text'?`<label>Texte / emoji<input type="text" value="${E(q.txt||'POW!')}" ${a('txt')}></label>`:''}${q.shape==='image'?`<label>Image<input type="file" accept="image/*" data-pimg="${i}" style="width:140px"></label>`:''}</div>`;
 h+=hitFxForm(q,a)+`</details>`;return h}
function hitFxForm(o,a){return `<b>Effet visuel sur la victime</b><div class="g">${sI('Type',a('hk'),HKINDS,o.hk)}${nI('Taille',a('hw'),o.hw,1,70)}${nI('Durée (images)',a('hf'),o.hf,1,70)}${colI('Couleur 1',a('hc'),o.hc||'#ffffff')}${colI('Couleur 2',a('hc2'),o.hc2||'#ffd24a')}${nI('Quantité',a('hn'),o.hn,1,70)}${nI('Lueur',a('hg'),o.hg,1,70)}${o.hk==='text'?`<label>Texte<input type="text" value="${E(o.ht||'POW!')}" ${a('ht')}></label>`:''}</div>`}
function moveForm(m){
 const ni=(f,v,at,st)=>`<input type="number" step="${st||1}" value="${v??''}" ${at} data-af="${f}" style="width:62px">`;
 let h=`<div class="box"><b>Déplacements pendant l'attaque :</b> <button data-lx="amv">+ Changement de vitesse</button> <button data-lx="atp">+ Téléportation</button></div>`;
 h+=(m.mv||[]).map((q,i)=>{const a=`data-ar="mv" data-ai="${i}"`;return `<div class="box">À l'image ${ni('t',q.t,a)} vitesse avant ${ni('vx',q.vx,a)} vitesse verticale ${ni('vy',q.vy,a)} <small>(vide = inchangée)</small> OU fonce vers l'adversaire à la vitesse ${ni('aim',q.aim,a)} <button data-lx="rmv${i}">✕</button></div>`}).join('');
 h+=(m.tp||[]).map((q,i)=>{const a=`data-ar="tp" data-ai="${i}"`;return `<div class="box">Téléportation à l'image ${ni('t',q.t,a)} avance de ${ni('dx',q.dx,a)} monte de ${ni('dy',q.dy,a)} <button data-lx="rtp${i}">✕</button></div>`}).join('');
 h+=`<div class="box"><b>Projectiles et pièges :</b> <button data-lx="aproj">+ Projectile</button></div>`;
 h+=(m.proj||[]).map(projForm).join('');
 if(/^(neu|side|up|down)B$/.test(m.k)&&!CH.moves[m.k+'a'])h+=`<div class="box"><button data-lx="mkair">Créer une version aérienne de ce spécial</button> <small>(utilisée quand tu le lances en l'air)</small></div>`;
 if(/^(neu|side|up|down)Ba$/.test(m.k))h+=`<div class="box"><button data-lx="rmair">Supprimer cette version aérienne</button></div>`;
 return h}
function effectsForm(m){
 const a=f=>`data-f="${f}"`,n=(f,l,st)=>nI(l,a(f),m[f],st,70);
 let h=sec('imp','Effets à l\'impact',`${n('stn','Étourdissement en plus (images)')}${n('hl','Gel de l\'image en plus (images)')}${n('shk','Tremblement de l\'écran (intensité)')}${n('dot','Brûlure : dégâts au total')}${n('dotT','Brûlure : durée (images)')}${n('vamp','Vol de vie (0 à 1 : part des dégâts soignée)',.05)}${sI('Son à l\'impact',a('sh'),SFX_LIST,m.sh)}${hitFxForm(m,a)}`);
 h+=sec('def','Défense, soin et bonus',`${sI('Protection pendant l\'attaque',a('ivm'),IVM,m.ivm||0)}${n('iv0','…de l\'image')}${n('iv1','…à l\'image')}${n('sheal','Soin immédiat (% retirés)')}${n('bf','Bonus temporaire : durée (images, 0 = aucun)')}${n('bdm','Bonus : dégâts ×',.1)}${n('bsp','Bonus : vitesse ×',.1)}${n('bjm','Bonus : saut ×',.1)}${n('bsz','Bonus : taille ×',.1)}${colI('Bonus : couleur de l\'aura',a('bcl'),m.bcl||'#ffd24a')}`);
 h+=sec('chain','Enchaînement, recharge et sons',`${sI('Enchaîne ensuite avec',a('nx'),[['','(rien)'],...Object.keys(CH.moves).map(k=>[k,CH.moves[k].n])],m.nx)}${cI('…seulement si le coup touche','data-c="nxh"',m.nxh)}${n('cd','Temps de recharge (images ; 60 = 1 s)')}${sI('Son au lancement',a('sf'),SFX_LIST,m.sf)}`);
 return h}
function mvUI(it,i){const l=it.mv||[];return `<details style="display:inline-block"><summary style="cursor:pointer">${l.length?'Seulement pendant '+l.length+' attaque(s)':'Toutes les attaques'}</summary><div style="max-height:160px;overflow:auto;padding:4px 8px;background:#10131f;border-radius:6px"><small>Coche une ou plusieurs attaques : l'objet n'apparaît que pendant celles-ci (rien coché = toujours).</small>${Object.keys(CH.moves).map(k=>`<label style="justify-content:flex-start"><input type="checkbox" data-imv="${i}" data-mk="${k}" ${l.includes(k)?'checked':''}> ${E(CH.moves[k].n)}</label>`).join('')}</div></details>`}
function itemsForm(){
 const groups=[...new Set(ITEM_PRESETS.map(p=>p.g))];
 let h=`<div class="box"><b>Ajouter un objet :</b></div>`+groups.map(g=>`<div class="box"><small style="width:80px">${g}</small>${ITEM_PRESETS.map((p,i)=>p.g===g?`<button data-ia="${i}">${p.n}</button>`:'').join(' ')}</div>`).join('');
 h+=`<div class="box">Aperçu avec l'attaque : <select data-ipv="1">${Object.keys(CH.moves).map(k=>`<option value="${k}" ${k==ipv?'selected':''}>${E(CH.moves[k].n)}</option>`).join('')}</select></div>`;
 h+=CH.items.map((it,i)=>{const a=f=>`data-it="${i}" data-if="${f}"`,n=(f,l)=>`<label>${l} <input type="number" value="${it[f]??0}" ${a(f)} style="width:64px"></label>`,sel=(f,list)=>`<select ${a(f)}>${list.map(([id,l])=>`<option value="${id}" ${(it[f]??'')==id?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="box card"><input type="text" value="${E(it.n)}" ${a('n')} style="width:110px"> ${sel('kind',ITEM_KINDS)} ${sel('at',ITEM_AT)} ${n('len','Longueur')} ${n('w','Épaisseur')} ${n('rot','Rotation °')} ${n('ox','Décalage X')} ${n('oy','Décalage Y')} ${n('glow','Lueur')} ${n('spin','Tourne (°/s)')} ${sel('when',ITEM_WHEN)} ${mvUI(it,i)} <input type="color" value="${it.color||'#cccccc'}" ${a('color')}> <input type="color" value="${it.color2||'#8a5a2b'}" ${a('color2')}> ${it.kind==='image'?`<input type="file" accept="image/*" data-iimg="${i}" style="width:150px">${it.img?` <span style="display:inline-flex;align-items:center;gap:6px"><span style="position:relative;display:inline-block"><img src="${it.img}" data-ipick="${i}" style="height:64px;max-width:160px;cursor:crosshair;background:#10131f;border:1px solid #556;display:block"><i style="position:absolute;left:${it.px??15}%;top:${it.py??50}%;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid #ff8c28;border-radius:50%;background:rgba(255,140,40,.35);pointer-events:none"></i></span><small>Clique sur l'image pour placer le centre (point d'attache et de rotation)</small> <label>Centre X % <input type="number" value="${it.px??15}" data-it="${i}" data-if="px" style="width:56px"></label> <label>Centre Y % <input type="number" value="${it.py??50}" data-it="${i}" data-if="py" style="width:56px"></label></span>`:''}`:''} <label><input type="checkbox" ${it.show===0?'':'checked'} ${a('show')}> visible</label> <button data-lx="iup${i}">↑</button><button data-lx="idn${i}">↓</button><button data-lx="idup${i}">Dupliquer</button><button data-lx="idel${i}">Supprimer</button></div>`}).join('');
 return h+`<small style="grid-column:1/-1">L'objet suit la main (ou la tête, le dos, le torse, la taille, un pied…) : les bras animés le font bouger. Les curseurs « Poignet » règlent son angle image par image. L'ordre de la liste = l'ordre d'affichage (le dernier est devant).</small>`}
function bodyForm(){
 const b=CH.body,rg=(l,k,mn,mx,st)=>`<label>${l}<span><input type="range" min="${mn}" max="${mx}" step="${st||1}" value="${b[k]}" data-bd="${k}" style="width:140px"> <output>${b[k]}</output></span></label>`,
 sl=(l,k,list)=>sI(l,`data-bd="${k}"`,list,b[k]),d=bodyDims(b);
 return `<div class="box"><b>Modèles :</b> ${BODY_PRESETS.map(([n],i)=>`<button data-bp="${i}">${n}</button>`).join(' ')}</div>`
 +`<div class="box card"><label><input type="checkbox" data-bk="mc" ${b.mc?'checked':''}> <b>Modèle Minecraft</b> (corps en blocs)</label>${b.mc?` <label>Skin (PNG 64×64 ou 64×32) <input type="file" accept="image/png" data-skin="1" style="width:190px"></label> <span>${b.skin?'✔ skin chargé':'skin par défaut'}</span> ${b.skin?'<button data-lx="skinclr">Retirer le skin</button>':''} ${sl('Tête','mcHead',MC_HEADS)} <label><input type="checkbox" data-bk="mcLayer" ${b.mcLayer===0?'':'checked'}> 2ᵉ couche (chapeau, manches, veste)</label>`:' <small>Active-le (ou clique « Minecraft (joueur) » dans les modèles) pour pouvoir mettre un skin.</small>'}</div>`
 +rg('Taille générale (×)','scale',.4,2.5,.05)
 +rg('Tête : taille','headR',4,26)+sl('Tête : forme','headShape',HEAD_SHAPES)+sl('Tête : décoration','headDeco',HEAD_DECOS)+sl('Yeux','eyes',EYES)
 +rg('Torse : longueur','torL',8,44)+rg('Torse : épaisseur','torW',4,40)+sl('Torse : forme','torShape',TORSO_SHAPES)
 +rg('Bras : longueur','armL',8,44)+rg('Bras : épaisseur','armW',3,20)+rg('Jambes : longueur','legL',10,48)+rg('Jambes : épaisseur','legW',3,20)
 +rg('Queue : longueur (0 = aucune)','tail',0,70)+rg('Queue : épaisseur','tailW',2,16)
 +`<label>Couleur du corps perso<span><input type="checkbox" data-bdc="color" ${b.color?'checked':''}> <input type="color" data-bd="color" value="${b.color||'#4aa3ff'}"></span></label>`
 +`<label>Couleur de la tête perso<span><input type="checkbox" data-bdc="headColor" ${b.headColor?'checked':''}> <input type="color" data-bd="headColor" value="${b.headColor||'#4aa3ff'}"></span></label>`
 +`<small style="grid-column:1/-1">Sans couleur perso, le personnage prend la couleur de son équipe (bleu = toi, rouge = l'IA). Zone touchable : ${Math.round(d.W*2)} × ${Math.round(d.H)} px (le cadre pointillé sur l'aperçu). Les zones de dégâts des attaques, les projectiles et les visuels grossissent avec la taille. Le poids (éjection) se règle dans « Déplacements / physique ».</small>`}
function pickImg(file,max,cb){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'));save();draw()};im.src=r.result};r.readAsDataURL(file)}
const save=()=>saveChar(CH),M=()=>CH.moves[cur],tot=()=>{if(NOM())return 1;const m=PM();return m.s+m.a+m.e};
